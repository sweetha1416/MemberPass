<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <filter id="mpGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="64" height="64" rx="16" fill="#070c1b" stroke="url(#mpGrad)" stroke-width="2.5" />
    <!-- Pass Badge Base -->
    <rect x="14" y="16" width="36" height="26" rx="6" fill="#111c38" stroke="url(#mpGrad)" stroke-width="2" />
    <!-- Pass Lanyard slot -->
    <rect x="27" y="12" width="10" height="3" rx="1.5" fill="#8b5cf6" />
    <!-- Chip -->
    <rect x="18" y="21" width="8" height="6" rx="1.5" fill="#06b6d4" />
    <!-- Details lines -->
    <rect x="29" y="21" width="16" height="2.5" rx="1" fill="#f8fafc" />
    <rect x="29" y="25.5" width="11" height="2" rx="1" fill="#94a3b8" />
    <!-- Mini QR/Code indicator -->
    <rect x="18" y="31" width="27" height="6" rx="2" fill="#1e293b" />
    <!-- AI Sparkle -->
    <path d="M46 38L47.5 42.5L52 44L47.5 45.5L46 50L44.5 45.5L40 44L44.5 42.5L46 38Z" fill="url(#mpGrad)" filter="url(#mpGlow)" />
</svg>
